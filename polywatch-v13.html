<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PolyWatch · Whale Tape</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090c; --panel:#0d0f14; --panel2:#12151c; --raise:#171b24;
  --line:#1c212c; --line2:#272d3a; --line3:#333b4c;
  --ink:#e9eef6; --ink2:#8b95a8; --ink3:#5a6479; --ink4:#3d4659;
  --up:#26d07c; --up-dim:rgba(38,208,124,.10); --up-mid:rgba(38,208,124,.28);
  --down:#ff4d6a; --down-dim:rgba(255,77,106,.10); --down-mid:rgba(255,77,106,.30);
  --brand:#41dcd9; --brand-dim:rgba(65,220,217,.10); --brand-mid:rgba(65,220,217,.30);
  --yes:#41dcd9; --yes-dim:rgba(65,220,217,.12);
  --no:#b08bff;  --no-dim:rgba(176,139,255,.14);
  --gold:#f4b942; --gold-dim:rgba(244,185,66,.12);
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Space Grotesk',system-ui,sans-serif;
  --r:10px; --rs:7px; --rl:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(65,220,217,.05), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(176,139,255,.045), transparent 55%),
    var(--bg);
  color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--line3)}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}

.shell{display:flex;flex-direction:column;height:100vh;min-height:0}

/* ───────── HEADER ───────── */
.hdr{flex-shrink:0;height:60px;display:flex;align-items:center;gap:16px;padding:0 22px;
  border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));}
.brand{display:flex;align-items:baseline;gap:9px}
.brand .mark{font-size:21px;line-height:1;filter:saturate(.9)}
.brand .name{font-weight:700;font-size:19px;letter-spacing:.04em}
.brand .name b{color:var(--brand)}
.brand .ver{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.14em;
  border:1px solid var(--line2);border-radius:100px;padding:2px 7px;align-self:center;text-transform:uppercase}
.status{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12.5px;color:var(--ink2);
  background:var(--panel);border:1px solid var(--line);border-radius:100px;padding:6px 13px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--ink3)}
.dot.live{background:var(--up);box-shadow:0 0 0 0 var(--up-mid);animation:pulse 2.4s infinite}
.dot.err{background:var(--down)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(38,208,124,.5)}70%{box-shadow:0 0 0 7px rgba(38,208,124,0)}100%{box-shadow:0 0 0 0 rgba(38,208,124,0)}}
.spacer{flex:1}
.iconbtn{width:38px;height:38px;border-radius:var(--rs);border:1px solid var(--line2);background:var(--panel);
  display:grid;place-items:center;color:var(--ink2);font-size:16px;transition:.15s}
.iconbtn:hover{color:var(--ink);border-color:var(--line3);background:var(--raise)}
.iconbtn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ───────── CONTROL BAR ───────── */
.ctrl{flex-shrink:0;display:flex;align-items:center;gap:14px;padding:13px 22px;
  border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:4px}
.tab{font-weight:600;font-size:14px;padding:8px 15px;border-radius:var(--rs);color:var(--ink2);
  display:flex;align-items:center;gap:7px;transition:.13s;white-space:nowrap}
.tab .ti{font-size:14px;opacity:.85}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--raise);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.tab.on.active-tab{color:var(--up)}
.period{display:flex;gap:3px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:3px}
.period button{font-family:var(--mono);font-size:12px;font-weight:600;padding:6px 11px;border-radius:var(--rs);
  color:var(--ink3);letter-spacing:.04em}
.period button.on{background:var(--raise);color:var(--brand)}
.mmtog{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;padding:8px 13px;color:var(--ink2);
  background:var(--bg);border:1px solid var(--line);border-radius:var(--r);white-space:nowrap;transition:.13s}
.mmtog:hover{color:var(--ink);border-color:var(--line3)}
.mmtog .knob{width:30px;height:17px;border-radius:9px;background:var(--line2);position:relative;transition:.16s;flex-shrink:0}
.mmtog .knob::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--ink3);transition:.16s}
.mmtog.on{color:var(--ink);border-color:var(--up-mid)}
.mmtog.on .knob{background:var(--up-mid)} .mmtog.on .knob::after{left:15px;background:var(--up)}
.wsub .edge.sharp{color:var(--up)} .wsub .edge.mid{color:var(--gold)} .wsub .edge.mm{color:var(--ink3)}
.search{flex:1;min-width:160px;max-width:300px;display:flex;align-items:center;gap:8px;
  background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:0 13px}
.search svg{color:var(--ink3);flex-shrink:0}
.search input{flex:1;background:none;border:none;color:var(--ink);font-family:var(--sans);font-size:14px;
  padding:10px 0;outline:none}
.search input::placeholder{color:var(--ink3)}
.copied-btn{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;padding:9px 15px;
  border-radius:var(--r);border:1px solid var(--line2);background:var(--panel);color:var(--ink2);transition:.15s}
.copied-btn:hover{color:var(--ink);border-color:var(--line3)}
.copied-btn.has{color:var(--gold);border-color:var(--gold-dim)}
.copied-btn .cc{font-family:var(--mono);font-weight:800;background:var(--gold-dim);color:var(--gold);
  padding:1px 7px;border-radius:100px;font-size:12px}

/* ───────── MAIN SPLIT ───────── */
.main{flex:1;display:grid;grid-template-columns:minmax(340px,400px) 1fr;min-height:0}
.col{min-height:0;display:flex;flex-direction:column;overflow:hidden}
.col.roster{border-right:1px solid var(--line);background:var(--panel)}
.col-hdr{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:13px 18px 11px;border-bottom:1px solid var(--line)}
.col-hdr .eyebrow{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink3)}
.col-hdr .meta{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden}

/* ───────── ROSTER ROW ───────── */
.wrow{position:relative;display:grid;grid-template-columns:30px 1fr auto;gap:11px;align-items:center;
  padding:13px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
.wrow:hover{background:var(--panel2)}
.wrow.sel{background:linear-gradient(90deg,var(--brand-dim),transparent 80%)}
.wrow.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
.wrank{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--ink3);text-align:center}
.wrow.sel .wrank{color:var(--brand)}
.wrank.medal{color:var(--gold)}
.wid{min-width:0}
.wname-row{display:flex;align-items:center;gap:7px}
.wname{font-weight:600;font-size:16px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:175px}
.livedot{width:7px;height:7px;border-radius:50%;background:var(--up);flex-shrink:0;box-shadow:0 0 6px var(--up);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
.verbadge{color:var(--brand);font-size:12px}
.wsub{display:flex;align-items:center;gap:8px;margin-top:3px;font-family:var(--mono);font-size:12px;color:var(--ink3)}
.wsub .sep{color:var(--ink4)}
.wsub .wr-good{color:var(--up)}
.wsub .wr-mid{color:var(--gold)}
.wsub .lastbet{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.wright{text-align:right;min-width:78px}
.wpnl{font-family:var(--mono);font-size:16px;font-weight:700;letter-spacing:-.01em}
.wpnl.up{color:var(--up)} .wpnl.down{color:var(--down)}
.wbar{margin-top:5px;height:4px;border-radius:3px;background:var(--line);overflow:hidden}
.wbar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--up-mid),var(--up))}
.wbar.down i{background:linear-gradient(90deg,var(--down-mid),var(--down))}
.statload{display:inline-block;width:34px;height:11px;border-radius:3px;
  background:linear-gradient(90deg,var(--line),var(--line2),var(--line));background-size:200% 100%;
  animation:shim 1.3s linear infinite;vertical-align:middle}
@keyframes shim{to{background-position:-200% 0}}

/* ───────── DETAIL PANE ───────── */
.col.detail{background:var(--bg)}
.dhead{flex-shrink:0;padding:20px 26px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--panel2),transparent)}
.dhead-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.davatar{width:46px;height:46px;border-radius:12px;flex-shrink:0;display:grid;place-items:center;
  font-family:var(--mono);font-weight:800;font-size:18px;color:var(--bg);
  background:linear-gradient(135deg,var(--brand),#2aa9a7)}
.dname{font-size:24px;font-weight:700;letter-spacing:.01em}
.daddr{font-family:var(--mono);font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.daddr a:hover{color:var(--brand)}
.dlive{margin-left:auto;display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12.5px;
  color:var(--up);background:var(--up-dim);border:1px solid var(--up-mid);border-radius:100px;padding:6px 12px}
.dlive.cold{color:var(--ink3);background:var(--panel);border-color:var(--line2)}
.dstats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:18px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.dstat{background:var(--panel);padding:13px 16px}
.dstat .sl{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink3)}
.dstat .sv{font-family:var(--mono);font-size:21px;font-weight:700;margin-top:5px;letter-spacing:-.01em}
.dstat .sv.up{color:var(--up)} .dstat .sv.down{color:var(--down)}
.dstat .sv small{font-size:12px;color:var(--ink3);font-weight:500}

.dbody{flex:1;overflow-y:auto;padding:22px 26px 40px}
.sectlabel{display:flex;align-items:center;gap:10px;margin:4px 0 16px}
.sectlabel .t{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink2)}
.sectlabel .c{font-family:var(--mono);font-size:12px;color:var(--ink3);
  background:var(--panel);border:1px solid var(--line);border-radius:100px;padding:2px 9px}
.sectlabel .line{flex:1;height:1px;background:var(--line)}

/* live bet cards */
.bets{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.bet{background:var(--panel);border:1px solid var(--line);border-radius:var(--rl);padding:16px 17px;
  display:flex;flex-direction:column;gap:13px;transition:.15s;position:relative;overflow:hidden}
.bet:hover{border-color:var(--line2);background:var(--panel2)}
.bet.pol{border-color:var(--down-mid)}
.bet.pol::after{content:"POLITICAL";position:absolute;top:13px;right:-30px;transform:rotate(45deg);
  background:var(--down);color:#fff;font-family:var(--mono);font-size:9px;font-weight:800;letter-spacing:.1em;
  padding:3px 34px}
.bet-top{display:flex;align-items:flex-start;gap:9px}
.chip{font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:.06em;padding:4px 9px;
  border-radius:6px;flex-shrink:0;text-transform:uppercase}
.chip.yes{background:var(--yes-dim);color:var(--yes);box-shadow:inset 0 0 0 1px var(--brand-mid)}
.chip.no{background:var(--no-dim);color:var(--no);box-shadow:inset 0 0 0 1px rgba(176,139,255,.3)}
.bet-mkt{font-size:16px;font-weight:600;line-height:1.32}
.bet-mkt a:hover{color:var(--brand)}
.bet-cat{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-top:4px}

/* price ladder */
.ladder{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.ladder-track{position:relative;height:6px;border-radius:4px;background:var(--line);margin:20px 4px 22px}
.ladder-fill{position:absolute;top:0;bottom:0;border-radius:4px;opacity:.5}
.ladder-fill.up{background:var(--up)} .ladder-fill.down{background:var(--down)}
.pin{position:absolute;top:50%;transform:translate(-50%,-50%);width:11px;height:11px;border-radius:50%;
  border:2px solid var(--bg)}
.pin.entry{background:var(--ink2)} .pin.cur{background:var(--brand);box-shadow:0 0 8px var(--brand-mid)}
.pin .lab{position:absolute;left:50%;transform:translateX(-50%);bottom:15px;white-space:nowrap;
  font-family:var(--mono);font-size:10px;font-weight:600;color:var(--ink3)}
.pin.cur .lab{color:var(--brand);bottom:auto;top:15px}
.ladder-foot{display:flex;justify-content:flex-start;align-items:center;gap:12px;margin-top:4px}
.lf-move{font-family:var(--mono);font-size:12px;font-weight:600}
.lf-move.up{color:var(--up)} .lf-move.down{color:var(--down)} .lf-move.flat{color:var(--ink3)}
.lf-note{font-family:var(--mono);font-size:11px;color:var(--ink3)}

.bet-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.bet-stat .l{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.bet-stat .v{font-family:var(--mono);font-size:17px;font-weight:700;margin-top:3px}
.bet-stat .v.up{color:var(--up)} .bet-stat .v.down{color:var(--down)}
.bet-stat .v small{font-size:12px;color:var(--ink3);font-weight:500}

.bet-actions{display:flex;gap:9px;margin-top:1px}
.copybtn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14.5px;
  padding:12px;border-radius:var(--r);background:var(--brand);color:#04201f;transition:.15s}
.copybtn:hover{filter:brightness(1.08)}
.copybtn.done{background:var(--up-dim);color:var(--up);box-shadow:inset 0 0 0 1px var(--up-mid)}
.cliptbn{width:46px;flex-shrink:0;border-radius:var(--r);border:1px solid var(--line2);background:var(--panel2);
  color:var(--ink2);display:grid;place-items:center;font-size:15px;transition:.15s}
.cliptbn:hover{color:var(--ink);border-color:var(--line3)}

/* tape (recent trades) */
.tape{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden}
.trow{display:grid;grid-template-columns:54px auto 1fr auto auto;gap:12px;align-items:center;
  background:var(--panel);padding:11px 15px;font-family:var(--mono);font-size:13px}
.trow:hover{background:var(--panel2)}
.tside{font-weight:700;font-size:11px;letter-spacing:.05em}
.tside.buy{color:var(--up)} .tside.sell{color:var(--down)}
.tmkt{color:var(--ink);font-family:var(--sans);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmkt a:hover{color:var(--brand)}
.tsize{font-weight:700;color:var(--ink);text-align:right}
.tprice{color:var(--ink2);text-align:right}
.tago{color:var(--ink3);text-align:right;font-size:12px}

/* empty / loading */
.empty{padding:60px 30px;text-align:center;color:var(--ink3)}
.empty .ico{font-size:34px;margin-bottom:14px;opacity:.5}
.empty .h{font-size:17px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.empty .p{font-size:14px;max-width:340px;margin:0 auto;line-height:1.55}
.skel{height:118px;border-radius:var(--rl);background:linear-gradient(90deg,var(--panel),var(--panel2),var(--panel));
  background-size:200% 100%;animation:shim 1.4s linear infinite}

/* copied tray (slide-over) */
.tray{position:fixed;top:0;right:0;bottom:0;width:min(440px,92vw);background:var(--panel);
  border-left:1px solid var(--line2);transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  z-index:50;display:flex;flex-direction:column;box-shadow:-30px 0 60px rgba(0,0,0,.5)}
.tray.open{transform:translateX(0)}
.tray-hdr{flex-shrink:0;display:flex;align-items:center;gap:11px;padding:18px 20px;border-bottom:1px solid var(--line)}
.tray-hdr .t{font-weight:700;font-size:17px}
.tray-hdr .s{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.tray-body{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:11px}
.cbet{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
.cbet-top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.cbet-mkt{font-size:14.5px;font-weight:600;line-height:1.3;margin:2px 0 9px}
.cbet-mkt a:hover{color:var(--brand)}
.cbet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-family:var(--mono)}
.cbet-grid .l{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.cbet-grid .v{font-size:14px;font-weight:700;margin-top:2px}
.cbet-grid .v.up{color:var(--up)} .cbet-grid .v.down{color:var(--down)}
.cbet-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;
  font-family:var(--mono);font-size:11px;color:var(--ink3)}
.cbet-foot button{color:var(--ink3)}.cbet-foot button:hover{color:var(--down)}
.backdrop{position:fixed;inset:0;background:rgba(4,5,8,.55);opacity:0;pointer-events:none;
  transition:opacity .28s;z-index:49}
.backdrop.show{opacity:1;pointer-events:auto}

/* toast */
.toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:80;
  display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--raise);border:1px solid var(--line2);border-radius:var(--r);padding:11px 18px;
  font-size:14px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.5);display:flex;align-items:center;gap:10px;
  animation:tin .3s cubic-bezier(.2,1,.3,1)}
.toast .ic{font-size:16px}
.bell{position:relative}
.bell.armed{color:var(--up);border-color:var(--up-mid)}
.bellcount{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--down);color:#fff;font-family:var(--mono);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.armbtn{font-weight:600;font-size:12.5px;padding:7px 12px;border-radius:var(--rs);color:var(--ink2);
  background:var(--bg);border:1px solid var(--line);white-space:nowrap;transition:.13s}
.armbtn:hover{color:var(--ink);border-color:var(--line3)}
.armbtn.on{background:var(--up-dim);color:var(--up);border-color:var(--up-mid)}
.acard{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--up);border-radius:var(--r);padding:13px 14px}
.acard.pol{border-left-color:var(--down)}
.acard .a-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.acard .a-whale{font-weight:700;font-size:15px}
.acard .a-edge{font-family:var(--mono);font-size:11px;color:var(--up)}
.acard .a-ago{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-left:auto}

  .shell{height:auto;min-height:100vh}

<body>
<div class="shell">

  <!-- HEADER -->
  <header class="hdr">
    <div class="brand">
      <span class="mark">🐋</span>
      <span class="name">Poly<b>Watch</b></span>
      <span class="ver">whale tape</span>
    </div>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="status-txt">Connecting…</span>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn bell" id="alerts-btn" title="Whale bet alerts" aria-label="Whale bet alerts">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>

    <button class="iconbtn" id="refresh-btn" title="Refresh" aria-label="Refresh data">

    <div class="spacer" style="flex:1"></div>
    <button class="armbtn" id="arm-btn" role="switch" aria-checked="false">Watch top 15</button>
    <button class="iconbtn" id="atray-close" aria-label="Close" style="width:32px;height:32px">✕</button>
  </div>
  <div class="tray-body" id="atray-body"></div>

<div class="toasts" id="toasts"></div>

<script>
/* ════════════════════ CONFIG ════════════════════ */
const API='https://polywatch.travis-shorrock.workers.dev';
const ROSTER_SIZE=24;        // whales pulled from leaderboard
const ACTIVE_WINDOW=3600000; // "live now" = traded within last 60 min
const POLL_MS=90000;         // background refresh
const CONCURRENCY=5;         // parallel enrichment fetches
const LS_KEY='pw13_copied';
const ALERT_MS=60000;       // poll watched whales every 60s for new bets
const WATCH_N=15;           // how many top (non-MM) whales to watch

/* ════════════════════ STATE ════════════════════ */
const S={
  whales:[],            // [{rank,name,addr,pnl,vol,verified}]
  profiles:{},          // addr -> {bigWins,biggestWin,grossWon,lastTradeTs,latestBet,loaded}
  positions:{},         // addr -> {ts,data:[...]}
  tape:{},              // addr -> {ts,data:[...]}
  sort:'pnl', period:'ALL', search:'', selected:null, hideMM:false,
  alerts:[], watching:false, baseline:{}, alertTimer:null,
  copied:[], live:false, demo:false, timer:null
};

/* ════════════════════ UTILS ════════════════════ */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function money(n){const a=Math.abs(+n||0);const s=a>=1e9?'$'+(a/1e9).toFixed(a>=1e10?0:1)+'B':a>=1e6?'$'+(a/1e6).toFixed(a>=1e7?0:1)+'M':a>=1e3?'$'+(a/1e3).toFixed(a>=1e5?0:1)+'k':'$'+Math.round(a);return(+n<0?'-':'')+s;}
function moneyFull(n){return(+n<0?'-$':'$')+Math.abs(Math.round(+n||0)).toLocaleString();}
function ago(ts){if(!ts)return'';const d=Math.floor((Date.now()-ts)/1000);if(d<60)return d+'s';if(d<3600)return Math.floor(d/60)+'m';if(d<86400)return Math.floor(d/3600)+'h';return Math.floor(d/86400)+'d';}
function cents(p){return Math.round((+p||0)*100)+'¢';}
function dirOf(v){if(v===0||v==='0')return'YES';if(v===1||v==='1')return'NO';const s=String(v==null?'':v).trim().toUpperCase();if(['NO','N','FALSE','DOWN','SHORT'].includes(s))return'NO';if(['YES','Y','TRUE','UP','LONG'].includes(s))return'YES';return'YES';}
function isPolitical(t){return /trump|president|election|congress|senate|biden|harris|gop|democrat|republican|govern|parliament|prime minister|tariff|supreme court|impeach|vote|ballot|primary/i.test(t||'');}
function category(t){const m=(t||'').toLowerCase();if(isPolitical(m))return'Politics';if(/btc|bitcoin|eth|crypto|solana|xrp|doge/.test(m))return'Crypto';if(/nba|nfl|mlb|nhl|ufc|soccer|football|premier|champions|cup|series|bowl|playoff/.test(m))return'Sports';if(/fed|rate|gdp|inflation|cpi|jobs|earnings|stock|ipo/.test(m))return'Macro';return'Other';}
function mktUrl(title,slug){const s=slug||String(title||'').toLowerCase().replace(/[^a-z0-9\s-]/g,'').trim().replace(/\s+/g,'-').slice(0,80);return s?`https://polymarket.com/event/${s}`:`https://polymarket.com/search?q=${encodeURIComponent(title||'')}`;}
function initials(name){const n=(name||'?').replace(/^0x/,'');return n.slice(0,2).toUpperCase();}
function jget(u){return fetch(u).then(r=>r.ok?r.json():Promise.reject(r.status));}
function asArray(raw){return Array.isArray(raw)?raw:(raw&&(raw.data||raw.users||raw.positions))||[];}
async function pool(items,fn,n){const q=items.slice();const run=async()=>{while(q.length){const it=q.shift();try{await fn(it);}catch(e){}}};await Promise.all(Array.from({length:Math.min(n,items.length)},run));}

/* ════════════════════ FETCH: LEADERBOARD ════════════════════ */
async function fetchLeaderboard(){
  const period=S.period;
  const lists=await Promise.all([
    jget(`${API}/proxy/leaderboard?timePeriod=${period}&limit=${ROSTER_SIZE}&orderBy=PNL`).catch(()=>[]),
    jget(`${API}/proxy/leaderboard?timePeriod=DAY&limit=20&orderBy=PNL`).catch(()=>[]) // freshness hint
  ]);
  const fresh=new Set(asArray(lists[1]).map(u=>(u.proxyWallet||u.proxyAddress||u.address||'').toLowerCase()).filter(Boolean));
  const seen={}, out=[];
  asArray(lists[0]).forEach(u=>{
    const addr=(u.proxyWallet||u.proxyAddress||u.address||'').toLowerCase();
    if(!addr||seen[addr])return; seen[addr]=1;
    const name=u.userName||u.name||u.username||(addr.slice(0,6)+'…'+addr.slice(-4));
    out.push({addr,name,pnl:+u.pnl||0,vol:+u.vol||+u.volume||0,verified:!!u.verifiedBadge,fresh:fresh.has(addr)});
  });
  if(!out.length){S.demo=true;S.live=false;return false;}
  out.forEach((w,i)=>w.rank=i+1);
  S.whales=out; S.live=true; S.demo=false;
  return true;
}

/* ════════════════════ FETCH: WHALE PROFILE (real win stats + last trade) ════════════════════ */
async function enrichWhale(w){
  const addr=w.addr;
  const prof=S.profiles[addr]||(S.profiles[addr]={bigWins:0,biggestWin:0,grossWon:0,lastTradeTs:0,latestBet:null,loaded:false});
  // closed-positions returns this whale's TOP realized winning positions (sorted by pnl desc, capped ~50).
  // It does NOT include losses, so it can't yield a true win rate — but it's a clean source for their biggest wins.
  try{
    const closed=asArray(await jget(`${API}/proxy/closed-positions?user=${addr}&limit=100`));
    let gross=0,big=0,n=0;
    closed.forEach(p=>{const r=+p.realizedPnl||+p.pnl||0;if(r>0){n++;gross+=r;if(r>big)big=r;}});
    prof.bigWins=n;prof.biggestWin=big;prof.grossWon=gross;
  }catch(e){}
  // recent activity -> last trade time + latest bet
  try{
    const acts=asArray(await jget(`${API}/proxy/activity?user=${addr}&limit=20`))
      .filter(a=>['BUY','SELL'].includes(String(a.side||'').toUpperCase()));
    if(acts.length){
      acts.sort((a,b)=>(+b.timestamp||0)-(+a.timestamp||0));
      const a=acts[0];
      prof.lastTradeTs=(+a.timestamp||0)*1000;
      prof.latestBet={market:a.title||a.market||'—',outcome:a.outcomeIndex===0?'YES':a.outcomeIndex===1?'NO':dirOf(a.outcome),
        side:String(a.side||'').toUpperCase(),price:+a.price||.5,size:+a.usdcSize||(+a.size||0)*(+a.price||0),
        slug:a.eventSlug||a.slug||'',ts:(+a.timestamp||0)*1000};
    }
  }catch(e){}
  prof.loaded=true;
  patchRow(addr);
  if(addr===S.selected){ // refresh open detail header once stats land, without nuking the live-bets body
    renderDetailHead(w);
    const pc=S.positions[addr],tc=S.tape[addr];
    if(pc&&tc)renderDetailBody(w,pc.data,tc.data);
    else $('detail').insertAdjacentHTML('beforeend',`<div class="dbody" id="dbody"><div class="bets"><div class="skel"></div><div class="skel"></div></div></div>`);
  }
}

/* ════════════════════ FETCH: OPEN POSITIONS (their live bets) ════════════════════ */
async function loadPositions(addr){
  const c=S.positions[addr];
  if(c&&Date.now()-c.ts<300000)return c.data;
  const raw=asArray(await jget(`${API}/proxy/positions?user=${addr}&limit=30`).catch(()=>[]));
  const now=Date.now();
  const ended=ed=>{if(!ed)return false;let ms=Date.parse(ed);if(isNaN(ms))return false;if(String(ed).length<=10)ms+=86400000;return ms<now;};
  const live=raw.filter(p=>p.redeemable!==true&&p.mergeable!==true&&!ended(p.endDate)).map(p=>{
    const size=+p.size||0;
    const avg=+p.avgPrice||+p.averagePrice||0;
    const cur=+p.curPrice||+p.currentPrice||avg||0;
    const stake=p.initialValue!=null?+p.initialValue:size*avg;
    const value=p.currentValue!=null?+p.currentValue:size*cur;
    const upnl=p.cashPnl!=null?+p.cashPnl:value-stake;
    const pct=p.percentPnl!=null?+p.percentPnl:(avg>0?(cur-avg)/avg*100:0);
    return {market:p.title||p.market||'Unknown',outcome:dirOf(p.outcome!=null?p.outcome:p.outcomeIndex),
      slug:p.eventSlug||p.slug||'',size,avg,cur,stake,value,upnl,pct};
  }).filter(p=>p.size>0&&p.cur>0.004&&p.cur<0.996&&p.stake>=1)
    .sort((a,b)=>b.stake-a.stake).slice(0,12);
  S.positions[addr]={ts:Date.now(),data:live};
  return live;
}
async function loadTape(addr){
  const c=S.tape[addr];
  if(c&&Date.now()-c.ts<120000)return c.data;
  const raw=asArray(await jget(`${API}/proxy/activity?user=${addr}&limit=30`).catch(()=>[]));
  const t=raw.filter(a=>['BUY','SELL'].includes(String(a.side||'').toUpperCase()))
    .map(a=>({market:a.title||a.market||'—',side:String(a.side||'').toUpperCase(),
      outcome:a.outcomeIndex===0?'YES':a.outcomeIndex===1?'NO':dirOf(a.outcome),
      price:+a.price||.5,size:+a.usdcSize||(+a.size||0)*(+a.price||0),slug:a.eventSlug||a.slug||'',
      ts:(+a.timestamp||0)*1000}))
    .sort((a,b)=>b.ts-a.ts).slice(0,14);
  S.tape[addr]={ts:Date.now(),data:t};
  return t;
}

/* ════════════════════ SORTING ════════════════════ */
function edgePct(w){return (w&&w.vol>0)?(w.pnl/w.vol*100):0;}
function edgeCls(e){return e>=20?'sharp':e>=8?'mid':'mm';}
const MM_HIDE=8;            // edge% below this = market maker (huge volume, no copyable edge)
function sortedWhales(){
  let arr=S.whales.slice();
  const q=S.search.trim().toLowerCase();
  if(q)arr=arr.filter(w=>w.name.toLowerCase().includes(q)||w.addr.includes(q));
  if(S.hideMM)arr=arr.filter(w=>edgePct(w)>=MM_HIDE);
  const P=a=>S.profiles[a.addr]||{};
  if(S.sort==='pnl')arr.sort((a,b)=>b.pnl-a.pnl);
  else if(S.sort==='sharp')arr.sort((a,b)=>edgePct(b)-edgePct(a)||b.pnl-a.pnl);
  else if(S.sort==='vol')arr.sort((a,b)=>(b.vol||0)-(a.vol||0)||b.pnl-a.pnl);
  else if(S.sort==='active')arr.sort((a,b)=>(P(b).lastTradeTs||0)-(P(a).lastTradeTs||0)||b.pnl-a.pnl);
  return arr;
}
const SORT_LABEL={pnl:'Top whales · by P&L',sharp:'Sharpest · by edge per \$ traded',vol:'Top whales · by volume traded',active:'Whales · by most recent trade'};

/* ════════════════════ RENDER: ROSTER ════════════════════ */
function renderRoster(){
  const perMap={ALL:'all-time',MONTH:'30d',WEEK:'7d'};
  let lbl=SORT_LABEL[S.sort];
  if(S.sort==='sharp'||S.sort==='vol'||S.sort==='pnl')lbl+=` <span style="color:var(--ink3)">· ${perMap[S.period]||''}</span>`;
  $('roster-label').innerHTML=lbl;
  const arr=sortedWhales();
  const liveN=arr.filter(w=>{const p=S.profiles[w.addr];return p&&Date.now()-p.lastTradeTs<ACTIVE_WINDOW;}).length;
  const hidden=S.hideMM?S.whales.length-arr.length:0;
  $('roster-meta').innerHTML=S.live?`${arr.length} shown · <span style="color:var(--up)">${liveN} live</span>${hidden?` · <span style="color:var(--ink3)">${hidden} MM hidden</span>`:''}`:'offline';
  if(!arr.length){
    $('roster').innerHTML=S.demo
      ? `<div class="empty"><div class="ico">📡</div><div class="h">Leaderboard offline</div><div class="p">Couldn't reach the Polymarket proxy. Hit refresh, or check the proxy on Railway.</div></div>`
      : `<div class="empty"><div class="ico">🔍</div><div class="h">No whales match “${esc(S.search)}”</div><div class="p">Clear the search to see the full roster.</div></div>`;
    return;
  }
  $('roster').innerHTML=arr.map(w=>rowHtml(w)).join('');
}
function rowHtml(w){
  const p=S.profiles[w.addr]||{};
  const sel=S.selected===w.addr?'sel':'';
  const isLive=p.lastTradeTs&&Date.now()-p.lastTradeTs<ACTIVE_WINDOW;
  const maxPnl=Math.max(...S.whales.map(x=>Math.abs(x.pnl)),1);
  const barPct=Math.max(4,Math.round(Math.abs(w.pnl)/maxPnl*100));
  const up=w.pnl>=0;
  // sub line varies by sort
  let sub='';
  if(S.sort==='active'&&p.latestBet){
    const b=p.latestBet;sub=`<span class="lastbet">${b.side==='BUY'?'▲':'▼'} ${esc(b.market.slice(0,26))}</span><span class="sep">·</span>${p.lastTradeTs?ago(p.lastTradeTs)+' ago':''}`;
  }else if(S.sort==='active'&&!p.loaded){
    sub=`<span class="statload"></span>`;
  }else{
    const e=edgePct(w);
    sub=`<span class="edge ${edgeCls(e)}" title="Profit per dollar traded — low means market-maker churn, not copyable edge">edge ${e>=10?Math.round(e):e.toFixed(1)}%</span><span class="sep">·</span>${money(w.vol)} vol`;
  }
  return `<div class="wrow ${sel}" data-addr="${w.addr}" tabindex="0" role="button">
    <div class="wrank ${w.rank<=3?'medal':''}">${w.rank}</div>
    <div class="wid">
      <div class="wname-row">
        ${isLive?'<span class="livedot" title="Traded in the last hour"></span>':''}
        <span class="wname">${esc(w.name)}</span>
        ${w.verified?'<span class="verbadge" title="Verified">✦</span>':''}
      </div>
      <div class="wsub">${sub}</div>
    </div>
    <div class="wright">
      <div class="wpnl ${up?'up':'down'}">${up?'+':''}${money(w.pnl)}</div>
      <div class="wbar ${up?'':'down'}"><i style="width:${barPct}%"></i></div>
    </div>
  </div>`;
}
function patchRow(addr){
  const el=document.querySelector(`.wrow[data-addr="${addr}"]`);
  if(el){const w=S.whales.find(x=>x.addr===addr);if(w)el.outerHTML=rowHtml(w);}
  // resort if the active metric depends on enrichment
  if(['active'].includes(S.sort))scheduleResort();
}
let _resortT=null;
function scheduleResort(){clearTimeout(_resortT);_resortT=setTimeout(renderRoster,400);}

/* ════════════════════ RENDER: DETAIL ════════════════════ */
async function selectWhale(addr){
  S.selected=addr;
  document.querySelectorAll('.wrow').forEach(r=>r.classList.toggle('sel',r.dataset.addr===addr));
  const w=S.whales.find(x=>x.addr===addr);if(!w)return;
  renderDetailHead(w);
  $('detail').insertAdjacentHTML('beforeend',`<div class="dbody" id="dbody"><div class="bets"><div class="skel"></div><div class="skel"></div></div></div>`);
  const [pos,tape]=await Promise.all([loadPositions(addr),loadTape(addr)]);
  if(S.selected!==addr)return;
  renderDetailBody(w,pos,tape);
}
function renderDetailHead(w){
  const p=S.profiles[w.addr]||{};
  const isLive=p.lastTradeTs&&Date.now()-p.lastTradeTs<ACTIVE_WINDOW;
  const up=w.pnl>=0;
  const bigTxt=p.loaded?(p.biggestWin>0?'+'+money(p.biggestWin):'—'):'…';
  const liveTxt=(p.openCount!=null)?String(p.openCount):'…';
  $('detail').innerHTML=`
  <div class="dhead">
    <div class="dhead-top">
      <div class="davatar">${initials(w.name)}</div>
      <div>
        <div class="dname">${esc(w.name)} ${w.verified?'<span class="verbadge" style="font-size:15px">✦</span>':''}</div>
        <div class="daddr">${w.addr.slice(0,10)}…${w.addr.slice(-6)}
          · <a href="https://polymarket.com/profile/${w.addr}" target="_blank" rel="noopener" style="color:var(--brand)">profile ↗</a></div>
      </div>
      <div class="dlive ${isLive?'':'cold'}">${isLive?'<span class="livedot"></span> Trading now':'Last trade '+(p.lastTradeTs?ago(p.lastTradeTs)+' ago':'unknown')}</div>
    </div>
    <div class="dstats">
      <div class="dstat"><div class="sl">All-time P&L</div><div class="sv ${up?'up':'down'}">${up?'+':''}${money(w.pnl)}</div></div>
      <div class="dstat"><div class="sl">Biggest win</div><div class="sv up">${bigTxt}</div></div>
      <div class="dstat"><div class="sl">Live bets</div><div class="sv" id="dstat-live">${liveTxt}</div></div>
      <div class="dstat"><div class="sl">Edge</div><div class="sv ${edgeCls(edgePct(w))==="mm"?"":edgeCls(edgePct(w))==="sharp"?"up":""}">${(()=>{const e=edgePct(w);return (e>=10?Math.round(e):e.toFixed(1))+'%';})()}<small> on ${money(w.vol)}</small></div></div>
    </div>
  </div>`;
}
function renderDetailBody(w,pos,tape){
  const betsHtml=pos.length
    ? `<div class="bets">${pos.map(b=>betCard(w,b)).join('')}</div>`
    : `<div class="empty"><div class="ico">💤</div><div class="h">No live bets right now</div><div class="p">${esc(w.name)} has no open positions on active markets — they're sitting in cash. Try another whale, or check back after they trade.</div></div>`;
  const tapeHtml=tape.length?`
    <div class="sectlabel" style="margin-top:30px"><span class="t">Recent trades</span><span class="c">${tape.length}</span><span class="line"></span></div>
    <div class="tape">${tape.map(t=>tapeRow(t)).join('')}</div>`:'';
  const _pp=S.profiles[w.addr]; if(_pp){_pp.openCount=pos.length; const _t=$('dstat-live'); if(_t)_t.textContent=String(pos.length);}
  $('detail').insertAdjacentHTML('beforeend',`<div class="dbody" id="dbody">
    <div class="sectlabel"><span class="t">Live bets — copy these</span><span class="c">${pos.length}</span><span class="line"></span></div>
    ${betsHtml}${tapeHtml}
  </div>`);
  // remove the temporary skeleton body if a second one was appended
  const bodies=document.querySelectorAll('#detail .dbody');
  if(bodies.length>1)bodies[0].remove();
}
function betCard(w,b){
  const pol=isPolitical(b.market);
  const moved=b.cur-b.avg;
  const movePct=b.avg>0?moved/b.avg*100:0;
  const clamp=(v)=>Math.max(5,Math.min(95,v));      // keep pins/labels inside the track at 0¢/100¢ extremes
  const entryL=clamp(b.avg*100), curL=clamp(b.cur*100);
  const fillL=Math.min(entryL,curL),fillW=Math.abs(curL-entryL);
  const up=b.upnl>=0;
  const moveCls=Math.abs(movePct)<1?'flat':moved>0?'up':'down';
  const note=Math.abs(movePct)<3?'still near entry — easy to copy':moved>0?'moved up since entry':'cheaper than entry';
  const payload=encodeURIComponent(JSON.stringify({addr:w.addr,whale:w.name,market:b.market,outcome:b.outcome,price:b.avg,cur:b.cur,size:b.stake,slug:b.slug}));
  return `<div class="bet ${pol?'pol':''}">
    <div class="bet-top">
      <span class="chip ${b.outcome==='YES'?'yes':'no'}">${b.outcome}</span>
      <div>
        <div class="bet-mkt"><a href="${mktUrl(b.market,b.slug)}" target="_blank" rel="noopener">${esc(b.market)}</a></div>
        <div class="bet-cat">${category(b.market)}</div>
      </div>
    </div>
    <div class="ladder">
      <div class="ladder-track">
        <div class="ladder-fill ${moved>=0?'up':'down'}" style="left:${fillL}%;width:${fillW}%"></div>
        <div class="pin entry" style="left:${entryL}%"><span class="lab">entry ${cents(b.avg)}</span></div>
        <div class="pin cur" style="left:${curL}%"><span class="lab">now ${cents(b.cur)}</span></div>
      </div>
      <div class="ladder-foot">
        <span class="lf-move ${moveCls}">${moved>0?'▲ +':moved<0?'▼ ':'• '}${Math.abs(Math.round(moved*100))}¢</span>
        <span class="lf-note">${note}</span>
      </div>
    </div>
    <div class="bet-grid">
      <div class="bet-stat"><div class="l">Their stake</div><div class="v">${money(b.stake)}</div></div>
      <div class="bet-stat"><div class="l">Unrealized</div><div class="v ${up?'up':'down'}">${up?'+':''}${money(b.upnl)} <small>${up?'+':''}${Math.round(b.pct)}%</small></div></div>
    </div>
    <div class="bet-actions">
      <button class="copybtn" data-copy="${payload}">Copy on Polymarket ↗</button>
      <button class="cliptbn" data-clip="${payload}" title="Copy bet details">⧉</button>
    </div>
  </div>`;
}
function tapeRow(t){
  return `<div class="trow">
    <span class="tside ${t.side==='BUY'?'buy':'sell'}">${t.side}</span>
    <span class="chip ${t.outcome==='YES'?'yes':'no'}" style="padding:2px 7px;font-size:10px">${t.outcome}</span>
    <span class="tmkt"><a href="${mktUrl(t.market,t.slug)}" target="_blank" rel="noopener">${esc(t.market)}</a></span>
    <span class="tsize">${money(t.size)}</span>
    <span class="tprice">${cents(t.price)}</span>
    <span class="tago">${ago(t.ts)}</span>
  </div>`;
}

/* ════════════════════ COPY / TRACK ════════════════════ */
function doCopy(payload,openMarket){
  const b=JSON.parse(decodeURIComponent(payload));
  if(openMarket)window.open(mktUrl(b.market,b.slug),'_blank','noopener');
  const txt=`${b.outcome} on "${b.market}" @ ${cents(b.price)} (now ${cents(b.cur)}) — copied from ${b.whale}`;
  navigator.clipboard&&navigator.clipboard.writeText(txt).catch(()=>{});
  // track it
  const id=b.addr+'|'+b.market+'|'+b.outcome;
  if(!S.copied.find(c=>c.id===id)){
    S.copied.unshift({id,whale:b.whale,addr:b.addr,market:b.market,outcome:b.outcome,
      copyPrice:b.price,curPrice:b.cur,slug:b.slug,ts:Date.now()});
    saveCopied();renderCopiedCount();
  }
  toast(openMarket?'Opened market · bet copied':'Bet details copied');
}
function renderCopiedCount(){
  const n=S.copied.length,el=$('copied-count'),btn=$('copied-btn');
  el.textContent=n;el.style.display=n?'inline-block':'none';
  btn.classList.toggle('has',n>0);
}
function openTray(){
  renderTray();$('tray').classList.add('open');$('backdrop').classList.add('show');
}
function closeTray(){$('tray').classList.remove('open');$('backdrop').classList.remove('show');}
function renderTray(){
  $('tray-sub').textContent=S.copied.length?`${S.copied.length} mirrored`:'Nothing copied yet';
  if(!S.copied.length){
    $('tray-body').innerHTML=`<div class="empty"><div class="ico">📋</div><div class="h">No copied bets yet</div><div class="p">When you hit “Copy on Polymarket”, the bet lands here so you can track the price you got in at against where it is now.</div></div>`;
    return;
  }
  $('tray-body').innerHTML=S.copied.map(c=>{
    const moved=(c.curPrice-c.copyPrice)*100;
    const cls=Math.abs(moved)<0.5?'':moved>0?'up':'down';
    return `<div class="cbet">
      <div class="cbet-top"><span class="chip ${c.outcome==='YES'?'yes':'no'}" style="padding:3px 8px;font-size:10px">${c.outcome}</span>
        <span style="font-family:var(--mono);font-size:12px;color:var(--ink3)">from ${esc(c.whale)} · ${ago(c.ts)} ago</span></div>
      <div class="cbet-mkt"><a href="${mktUrl(c.market,c.slug)}" target="_blank" rel="noopener">${esc(c.market)}</a></div>
      <div class="cbet-grid">
        <div><div class="l">You copied @</div><div class="v">${cents(c.copyPrice)}</div></div>
        <div><div class="l">Now</div><div class="v">${cents(c.curPrice)}</div></div>
        <div><div class="l">Drift</div><div class="v ${cls}">${moved>0?'+':''}${Math.round(moved)}¢</div></div>
      </div>
      <div class="cbet-foot"><a href="${mktUrl(c.market,c.slug)}" target="_blank" rel="noopener" style="color:var(--brand)">open market ↗</a>
        <button data-remove="${esc(c.id)}">remove</button></div>
    </div>`;
  }).join('');
}
function saveCopied(){try{localStorage.setItem(LS_KEY,JSON.stringify(S.copied.slice(0,80)));}catch(e){}}
function loadCopied(){try{S.copied=JSON.parse(localStorage.getItem(LS_KEY))||[];}catch(e){S.copied=[];}}

/* ════════════════════ STATUS / TOAST ════════════════════ */
function setStatus(){
  const dot=$('dot');
  if(S.live){dot.className='dot live';$('status-txt').innerHTML=`Live · ${S.whales.length} whales tracked`;}
  else if(S.demo){dot.className='dot err';$('status-txt').textContent='Proxy offline';}
  else{dot.className='dot';$('status-txt').textContent='Connecting…';}
}
/* ════════════════════ WHALE BET ALERTS ════════════════════ */
function watchedWhales(){
  // top WATCH_N by P&L, skipping market makers (no point alerting on churn)
  return S.whales.slice().sort((a,b)=>b.pnl-a.pnl).filter(w=>edgePct(w)>=MM_HIDE).slice(0,WATCH_N);
}
function armAlerts(){
  S.watching=true;
  const ws=watchedWhales();
  ws.forEach(w=>{const p=S.profiles[w.addr];S.baseline[w.addr]=(p&&p.lastTradeTs)?Math.floor(p.lastTradeTs/1000):Math.floor(Date.now()/1000);});
  if('Notification'in window&&Notification.permission==='default')Notification.requestPermission().catch(()=>{});
  if(S.alertTimer)clearInterval(S.alertTimer);
  S.alertTimer=setInterval(pollAlerts,ALERT_MS);
  setArmUI();toast(`Watching ${ws.length} top whales for new bets`);
}
function disarmAlerts(){S.watching=false;if(S.alertTimer)clearInterval(S.alertTimer);S.alertTimer=null;setArmUI();toast('Stopped watching');}
function setArmUI(){
  const btn=$('arm-btn'),bell=$('alerts-btn');
  btn.classList.toggle('on',S.watching);btn.setAttribute('aria-checked',S.watching);
  btn.textContent=S.watching?'Watching ✓':`Watch top ${WATCH_N}`;
  bell.classList.toggle('armed',S.watching);
  const n=watchedWhales().length;
  $('atray-sub').textContent=S.watching?`live · polling ${n} whales every 60s`:'Off';
}
async function pollAlerts(){
  if(!S.watching)return;
  const ws=watchedWhales();
  for(const w of ws){
    try{
      const acts=asArray(await jget(`${API}/proxy/activity?user=${w.addr}&limit=8`))
        .filter(a=>['BUY','SELL'].includes(String(a.side||'').toUpperCase()));
      if(!acts.length)continue;
      acts.sort((a,b)=>(+b.timestamp||0)-(+a.timestamp||0));
      const base=S.baseline[w.addr]||0;
      const fresh=acts.filter(a=>(+a.timestamp||0)>base);
      if(fresh.length){
        S.baseline[w.addr]=+fresh[0].timestamp||base;       // advance baseline
        fresh.reverse().forEach(a=>pushAlert(w,a));          // oldest-first so newest ends on top
        if(S.profiles[w.addr]){S.profiles[w.addr].lastTradeTs=(+fresh[0].timestamp||0)*1000;}
      }
    }catch(e){}
  }
}
function pushAlert(w,a){
  const mkt=a.title||a.market||'—';
  const outcome=a.outcomeIndex===0?'YES':a.outcomeIndex===1?'NO':dirOf(a.outcome);
  const side=String(a.side||'').toUpperCase();
  const usd=+a.usdcSize||(+a.size||0)*(+a.price||0);
  const item={id:w.addr+'|'+mkt+'|'+outcome+'|'+a.timestamp,whale:w.name,addr:w.addr,edge:edgePct(w),
    market:mkt,outcome,side,price:+a.price||0,usd,slug:a.eventSlug||a.slug||'',ts:(+a.timestamp||0)*1000,pol:isPolitical(mkt)};
  if(S.alerts.find(x=>x.id===item.id))return;
  S.alerts.unshift(item);if(S.alerts.length>60)S.alerts.pop();
  renderAlertsCount();if($('atray').classList.contains('open'))renderAlertsTray();
  toast(`${w.name} ${side} ${outcome} · ${esc(mkt.slice(0,32))}`);
  if('Notification'in window&&Notification.permission==='granted'){
    try{new Notification(`🐋 ${w.name} just bet`,{body:`${side} ${outcome} @ ${cents(item.price)} — ${mkt.slice(0,80)}`,tag:item.id});}catch(e){}
  }
}
function renderAlertsCount(){
  const n=S.alerts.length,el=$('alerts-count');
  el.textContent=n>9?'9+':n;el.style.display=n?'flex':'none';
}
function openAlerts(){renderAlertsTray();$('atray').classList.add('open');$('backdrop').classList.add('show');}
function closeAlerts(){$('atray').classList.remove('open');if(!$('tray').classList.contains('open'))$('backdrop').classList.remove('show');}
function renderAlertsTray(){
  if(!S.alerts.length){
    $('atray-body').innerHTML=S.watching
      ? `<div class="empty"><div class="ico">🛰️</div><div class="h">Watching for bets…</div><div class="p">No new bets from your top whales yet. When one places a trade, it lands here instantly — and as a desktop alert if you allowed notifications.</div></div>`
      : `<div class="empty"><div class="ico">🔔</div><div class="h">Alerts are off</div><div class="p">Hit “Watch top ${WATCH_N}” above to start tracking the sharpest whales. You'll get a ping the moment any of them places a new bet.</div></div>`;
    return;
  }
  $('atray-body').innerHTML=S.alerts.map(a=>{
    const payload=encodeURIComponent(JSON.stringify({addr:a.addr,whale:a.whale,market:a.market,outcome:a.outcome,price:a.price,cur:a.price,size:a.usd,slug:a.slug}));
    return `<div class="acard ${a.pol?'pol':''}">
      <div class="a-top"><span class="a-whale">${esc(a.whale)}</span><span class="a-edge">${Math.round(a.edge)}% edge</span><span class="a-ago">${ago(a.ts)} ago</span></div>
      <div class="a-mkt"><a href="${mktUrl(a.market,a.slug)}" target="_blank" rel="noopener">${esc(a.market)}</a></div>
      <div class="a-row"><span class="chip ${a.outcome==='YES'?'yes':'no'}" style="padding:2px 8px;font-size:10px">${a.outcome}</span><span class="tside ${a.side==='BUY'?'buy':'sell'}">${a.side}</span><span>${cents(a.price)}</span><span>${money(a.usd)}</span></div>
      <a class="a-copy" href="${mktUrl(a.market,a.slug)}" target="_blank" rel="noopener" data-acopy="${payload}">Copy on Polymarket ↗</a>
    </div>`;
  }).join('');
}

function toast(msg){
  const t=document.createElement('div');t.className='toast good';
  t.innerHTML=`<span class="ic">✓</span>${esc(msg)}`;
  $('toasts').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transform='translateY(8px)';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},2600);
}

/* ════════════════════ EVENTS ════════════════════ */
$('sort-tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab');if(!b)return;
  S.sort=b.dataset.sort;
  document.querySelectorAll('#sort-tabs .tab').forEach(t=>{t.classList.toggle('on',t===b);t.classList.toggle('active-tab',t===b&&S.sort==='active');});
  renderRoster();
});
$('period').addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#period button').forEach(x=>x.classList.toggle('on',x===b));
  S.period=b.dataset.p;
  await boot(true);
});
$('hidemm').addEventListener('click',()=>{S.hideMM=!S.hideMM;const t=$('hidemm');t.classList.toggle('on',S.hideMM);t.setAttribute('aria-checked',S.hideMM);renderRoster();});
$('search').addEventListener('input',e=>{S.search=e.target.value;renderRoster();});
$('roster').addEventListener('click',e=>{const r=e.target.closest('.wrow');if(r)selectWhale(r.dataset.addr);});
$('roster').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('wrow')){e.preventDefault();selectWhale(e.target.dataset.addr);}});
$('detail').addEventListener('click',e=>{
  const c=e.target.closest('[data-copy]');if(c){doCopy(c.dataset.copy,true);c.classList.add('done');c.textContent='Copied ✓';setTimeout(()=>{c.classList.remove('done');c.textContent='Copy on Polymarket ↗';},1800);return;}
  const cl=e.target.closest('[data-clip]');if(cl){doCopy(cl.dataset.clip,false);return;}
});
$('copied-btn').addEventListener('click',openTray);
$('alerts-btn').addEventListener('click',openAlerts);
$('arm-btn').addEventListener('click',()=>{S.watching?disarmAlerts():armAlerts();});
$('atray-close').addEventListener('click',closeAlerts);
$('atray-body').addEventListener('click',e=>{const c=e.target.closest('[data-acopy]');if(c){doCopy(c.dataset.acopy,false);} });
$('tray-close').addEventListener('click',closeTray);
$('backdrop').addEventListener('click',()=>{closeTray();closeAlerts();});
$('tray-body').addEventListener('click',e=>{const r=e.target.closest('[data-remove]');if(r){S.copied=S.copied.filter(c=>c.id!==r.dataset.remove);saveCopied();renderCopiedCount();renderTray();}});
$('refresh-btn').addEventListener('click',()=>boot(true));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeTray();closeAlerts();}});

/* ════════════════════ BOOT ════════════════════ */
async function boot(manual){
  if(manual){$('refresh-btn').classList.add('spin');}
  clearInterval(S.timer);
  const ok=await fetchLeaderboard();
  setStatus();renderRoster();renderCopiedCount();
  if(ok){
    // auto-select top whale
    const first=sortedWhales()[0];
    if(first&&(!S.selected||!S.whales.find(w=>w.addr===S.selected)))selectWhale(first.addr);
    else if(S.selected)selectWhale(S.selected);
    // enrich everyone in the background (real win stats + last-trade)
    pool(S.whales,enrichWhale,CONCURRENCY).then(()=>{renderRoster();setStatus();});
  }
  if(manual)setTimeout(()=>$('refresh-btn').classList.remove('spin'),700);
  S.timer=setInterval(()=>fetchLeaderboard().then(()=>{renderRoster();setStatus();}),POLL_MS);
}

loadCopied();
boot();
</script>
